<!DOCTYPE html>
<html lang="ar">
<head>
    <!-- Basic meta settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo Survey - Results</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0">Submitted Info</h3>
            </div>

            <div class="card-body">
                <!-- Display submitted form data using Jinja template variables -->
                <ul class="list-group list-group-flush">
                    <li class="list-group-item"><strong>Name:</strong> {{ name }}</li>
                    <li class="list-group-item"><strong>Dojo Location:</strong> {{ location }}</li>
                    <li class="list-group-item"><strong>Favorite Language:</strong> {{ language }}</li>
                    <li class="list-group-item"><strong>Gender:</strong> {{ gender }}</li>
                    <li class="list-group-item"><strong>Comment:</strong> {{ comment }}</li>
                </ul>

                <!-- Button to go back to the home page -->
                <div class="mt-4 text-center">
                    <a href="/" class="btn btn-primary">Go Back</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
