<!DOCTYPE html>
<html lang="ar">
<head>
    <!-- Basic meta settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo Survey - Index</title>

    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Dojo Survey</h3>
            </div>

            <div class="card-body">

                <!-- Form that sends data to /result using POST method -->
                <form action="/result" method="POST">

                    <!-- Name input field -->
                    <div class="mb-3">
                        <label for="name" class="form-label">Your Name:</label>
                        <input type="text" class="form-control" id="name" name="name" required placeholder="Enter your name">
                    </div>

                    <!-- Location dropdown -->
                    <div class="mb-3">
                        <label for="location" class="form-label">Dojo Location:</label>
                        <select class="form-select" id="location" name="location">
                            <option value="San Jose">San Jose</option>
                            <option value="Seattle">Seattle</option>
                            <option value="Online">Online</option>
                        </select>
                    </div>

                    <!-- Programming language dropdown -->
                    <div class="mb-3">
                        <label for="language" class="form-label">Favorite Language:</label>
                        <select class="form-select" id="language" name="language">
                            <option value="Python">Python</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="Java">Java</option>
                        </select>
                    </div>

                    <!-- Gender radio buttons -->
                    <div class="mb-3">
                        <label class="form-label">Gender:</label>
                        <div>
                            <!-- Male option -->
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="male" value="Male" checked>
                                <label class="form-check-label" for="male">Male</label>
                            </div>

                            <!-- Female option -->
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="female" value="Female">
                                <label class="form-check-label" for="female">Female</label>
                            </div>
                        </div>
                    </div>

                    <!-- Optional comment textarea -->
                    <div class="mb-3">
                        <label for="comment" class="form-label">Comment (optional):</label>
                        <textarea class="form-control" id="comment" name="comment" rows="3" placeholder="Hi there :)"></textarea>
                    </div>

                    <!-- Submit button -->
                    <button type="submit" class="btn btn-success w-100">
                        Submit
                    </button>

                </form>
            </div>
        </div>
    </div>
</body>
</html>
