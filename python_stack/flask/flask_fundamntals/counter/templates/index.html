<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow p-5 text-center" style="width: 350px;">
        <h1 class="mb-4">Counter</h1>
        
        <div class="display-1 fw-bold text-primary mb-3">
            {{ count }}
        </div>
        
        <p class="text-muted">times.</p>

        <div class="d-grid gap-2 mt-4">
            <a href="/" class="btn btn-outline-primary">Click Me! (Refresh)</a>
            
            <a href="/destroy_session" class="btn btn-danger">Reset / Destroy Session</a>
        </div>
    </div>

</body>
</html>
