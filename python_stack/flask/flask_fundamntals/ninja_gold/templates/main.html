<!DOCTYPE html>
<html>
<head>
    <title>Ninja Gold</title>
    <style>
        body { font-family: Arial; text-align: center; }
        .buildings { display: flex; justify-content: center; gap: 20px; margin: 20px; }
        .building { border: 1px solid black; padding: 20px; width: 150px; }
        .activities { margin: 20px auto; width: 60%; text-align: left; }
        .green { color: green; }
        .red { color: red; }
    </style>
</head>
<body>
    <h1>Ninja Gold 🥷</h1>
    <h2>Your Gold: {{ gold }}</h2>

    <div class="buildings">

        <div class="building">
            <h3>Farm</h3>
            <p>(earns 10-20 golds)</p>
            <form action="/process_money" method="post">
                <input type="hidden" name="building" value="farm">
                <input type="submit" value="Find Gold!">
            </form>
        </div>

        <div class="building">
            <h3>Cave</h3>
            <p>(earns 5-10 golds)</p>
            <form action="/process_money" method="post">
                <input type="hidden" name="building" value="cave">
                <input type="submit" value="Find Gold!">
            </form>
        </div>

        <div class="building">
            <h3>House</h3>
            <p>(earns 2-5 golds)</p>
            <form action="/process_money" method="post">
                <input type="hidden" name="building" value="house">
                <input type="submit" value="Find Gold!">
            </form>
        </div>

        <div class="building">
            <h3>Casino</h3>
            <p>(earns/takes 0-50 golds)</p>
            <form action="/process_money" method="post">
                <input type="hidden" name="building" value="casino">
                <input type="submit" value="Find Gold!">
            </form>
        </div>

    </div>

    <div class="activities">
        <h3>Activities:</h3>
        {% for activity in activities %}
            <p class="{{ activity.color }}">{{ activity.message }}</p>
        {% endfor %}
    </div>

    <a href="/reset">Reset Game</a>

</body>
</html>
