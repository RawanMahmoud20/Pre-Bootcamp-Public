<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dojo Fruit Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 700px;">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h2>Dojo Fruit Store!</h2>
            </div>
            <div class="card-body">
                <form action="/checkout" method="POST">
                    <h4 class="mb-3">What would you like to buy?</h4>
                    
                    <table class="table table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>Fruit Name</th>
                                <th>Quantity</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Strawberry</td>
                                <td>
                                    <select name="strawberry" class="form-select">
                                        <option value="0">0</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td>Raspberry</td>
                                <td>
                                    <select name="raspberry" class="form-select">
                                        <option value="0">0</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td>Apple</td>
                                <td>
                                    <select name="apple" class="form-select">
                                        <option value="0">0</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                    </select>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <h4 class="mt-4 mb-3">Your Information</h4>
                    <div class="mb-3">
                        <label for="first_name" class="form-label">First Name:</label>
                        <input type="text" name="first_name" id="first_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="last_name" class="form-label">Last Name:</label>
                        <input type="text" name="last_name" id="last_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="student_id" class="form-label">Your Student ID:</label>
                        <input type="text" name="student_id" id="student_id" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Buy me stuff!</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
