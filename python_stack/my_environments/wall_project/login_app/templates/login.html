<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 450px;">
    <div class="card p-4 shadow-sm mt-5">
        <h2 class="mb-4 text-success text-center">Login</h2>
        {% if messages %}
            {% for message in messages %}
                {% if 'login' in message.tags %}<div class="alert alert-danger py-1 small">{{ message }}</div>{% endif %}
            {% endfor %}
        {% endif %}
        <form action="/login" method="POST">
            {% csrf_token %}
            <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
            <button type="submit" class="btn btn-success w-100">Log In</button>
        </form>
        <p class="text-center mt-3 small">New user? <a href="/">Register here</a></p>
    </div>
</div>
</body>
</html>
