<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Show {{ show.id }}</title>
</head>
<body>
    <a href="/shows">Go Back</a>
    <h1>Edit Show {{ show.id }}</h1>
    <form action="/shows/{{ show.id }}/update" method="POST">
        {% csrf_token %}
        <p>Title: <input type="text" name="title" value="{{ show.title }}" required></p>
        <p>Network: <input type="text" name="network" value="{{ show.network }}" required></p>
        <p>Release Date: <input type="date" name="release_date" value="{{ show.release_date|date:'Y-m-d' }}" required></p>
        <p>Description:<br>
        <textarea name="description" cols="30" rows="5">{{ show.description }}</textarea></p>
        <button type="submit">Update</button>
    </form>
    <br>
    <a href="/shows/{{ show.id }}">Go to Show</a>
</body>
</html>
