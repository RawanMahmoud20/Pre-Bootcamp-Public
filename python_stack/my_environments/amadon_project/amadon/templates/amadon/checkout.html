<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amadon Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="card p-4 shadow-sm">
        <h2 class="text-success mb-3">Thank you for your business!</h2>
        <p class="fs-5">We charged your credit card for <strong>${{ last_charge|stringformat:".2f" }}</strong>.</p>
        
        <div class="alert alert-info mt-4">
            You have ordered <strong>{{ total_qty }}</strong> items so far and spent 
            <strong>${{ total_spent|stringformat:".2f" }}</strong> with Amadon.com!
        </div>
        
        <a href="{% url 'index' %}" class="btn btn-secondary mt-3" style="width: 120px;">Go back</a>
    </div>
</body>
</html>
