<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojo Survey - Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 card p-4 shadow-sm">
                <h2 class="text-center mb-4 text-primary">Dojo Survey</h2>
                
                <form action="/result" method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="name" class="form-label">Your Name:</label>
                        <input type="text" name="name" id="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="location" class="form-label">Dojo Location:</label>
                        <select name="location" id="location" class="form-select" required>
                            <option value="San Jose">San Jose</option>
                            <option value="Seattle">Seattle</option>
                            <option value="Chicago">Chicago</option>
                            <option value="Online">Online</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="language" class="form-label">Favorite Language:</label>
                        <select name="language" id="language" class="form-select" required>
                            <option value="Python">Python</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="C#">C#</option>
                            <option value="Java">Java</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label d-block">Gender:</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="male" value="Male" checked>
                            <label class="form-check-input-placeholder" for="male">Male</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="female" value="Female">
                            <label class="form-check-input-placeholder" for="female">Female</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label d-block">Interests:</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="interests" value="Web Development" id="webdev">
                            <label class="form-check-label" for="webdev">Web Development</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="interests" value="Data Science" id="datascience">
                            <label class="form-check-label" for="datascience">Data Science</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="interests" value="Cyber Security" id="cyber">
                            <label class="form-check-label" for="cyber">Cyber Security</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="comment" class="form-label">Comment (Optional):</label>
                        <textarea name="comment" id="comment" rows="3" class="form-control"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Submit</button>
                </form>

            </div>
        </div>
    </div>
</body>
</html>
