<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book and Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 650px; margin: auto; }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-4">
            <h2 class="h4 text-primary m-0">Add a New Book & Review</h2>
            <div>
                <a href="/books" class="btn btn-outline-secondary btn-sm me-2">Home</a>
                <a href="/logout" class="btn btn-outline-danger btn-sm">Log Out</a>
            </div>
        </div>

        <form action="/books/create" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Book Title</label>
                <input type="text" name="title" class="form-control" placeholder="Enter book title" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Author (Choose from list)</label>
                <select name="selected_author" class="form-select">
                    <option value="">-- Select an Author --</option>
                    {% for author in authors %}
                        <option value="{{ author }}">{{ author }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Or add a new author</label>
                <input type="text" name="custom_author" class="form-control" placeholder="Type new author name">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Review</label>
                <textarea name="review" class="form-control" rows="4" placeholder="Write your thoughts about the book..." required></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Rating (Stars)</label>
                <select name="rating" class="form-select w-auto" required>
                    <option value="5">5 ★★★★★</option>
                    <option value="4">4 ★★★★☆</option>
                    <option value="3">3 ★★★☆☆</option>
                    <option value="2">2 ★★☆☆☆</option>
                    <option value="1">1 ★☆☆☆☆</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">Submit Book & Review</button>
        </form>
    </div>
</div>
</body>
</html>
