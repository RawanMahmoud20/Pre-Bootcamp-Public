<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Dojo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow border-0 p-4">
                    <div class="card-body">
                        
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h3 class="card-title fw-bold text-danger m-0">🏯 Add a Dojo</h3>
                            <a href="/" class="text-secondary text-decoration-none small">← Back</a>
                        </div>

                        <form action="/create_dojo" method="post">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label text-secondary fw-semibold small text-uppercase">Dojo Name</label>
                                <input type="text" name="name" class="form-control" placeholder="e.g. Coding Dojo" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-secondary fw-semibold small text-uppercase">City</label>
                                <input type="text" name="city" class="form-control" placeholder="e.g. Seattle" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-secondary fw-semibold small text-uppercase">State</label>
                                <input type="text" name="state" class="form-control" placeholder="e.g. WA" maxlength="2" required>
                            </div>

                            <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">Create Dojo</button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
