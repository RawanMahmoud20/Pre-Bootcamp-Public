<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 450px; margin: auto; }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="card p-4 mt-5">
        <h2 class="mb-4 text-success text-center">Welcome Back</h2>

        {% if messages %}
            {% for message in messages %}
                {% if 'login' in message.tags %}
                    <div class="alert alert-danger py-2 fs-6">{{ message }}</div>
                {% endif %}
            {% endfor %}
        {% endif %}

        <form action="/login" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100 mt-3">Log In</button>
        </form>
        
        <div class="text-center mt-3">
            <p class="text-muted small">Don't have an account? <a href="/" class="text-decoration-none">Register here</a></p>
        </div>
    </div>
</div>
</body>
</html>
