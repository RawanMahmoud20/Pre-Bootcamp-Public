<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ user.first_name }}'s Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Header -->
    <nav class="navbar navbar-light bg-white shadow-sm px-4">
        <a href="/books" class="btn btn-outline-secondary btn-sm">← Dashboard</a>
        <a href="/logout" class="btn btn-outline-danger btn-sm">Log Out</a>
    </nav>

    <div class="container mt-4">
        <div class="bg-white p-4 rounded shadow">

            <!-- User Info -->
            <h4 class="text-primary mb-1">{{ user.first_name }} {{ user.last_name }}</h4>
            <p class="text-muted">📧 {{ user.email }}</p>

            <hr>

            <!-- Liked Books -->
            <h5 class="mt-3 mb-3">⭐ Books Liked by {{ user.first_name }}:</h5>

            <ul class="list-group">
                {% for book in user.liked_books.all %}
                <li class="list-group-item">
                    <a href="/books/{{ book.id }}" class="text-decoration-none">{{ book.title }}</a>
                </li>
                {% empty %}
                <li class="list-group-item text-muted">This user hasn't favorited any books yet.</li>
                {% endfor %}
            </ul>

        </div>
    </div>

</body>
</html>
