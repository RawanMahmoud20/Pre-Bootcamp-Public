<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 30px;">
    <div style="max-width: 450px; margin: 60px auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        <h2 style="color: #6f42c1; text-align: center; margin-bottom: 25px;">Create Account</h2>

        {% if messages %}
            {% for message in messages %}
                <p style="color: red; font-size: 14px;">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form action="/process_registration" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
            {% csrf_token %}
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">First Name:</label>
                <input type="text" name="first_name" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Last Name:</label>
                <input type="text" name="last_name" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Email:</label>
                <input type="email" name="email" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Password:</label>
                <input type="password" name="password" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Confirm Password:</label>
                <input type="password" name="password_confirm" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <button type="submit" style="background-color: #6f42c1; color: white; font-weight: bold; padding: 10px; border: none; border-radius: 4px; cursor: pointer;">Register</button>
        </form>

        <p style="text-align: center; margin-top: 20px; color: #666;">Already have an account? <a href="/signin" style="color: #6f42c1; font-weight: bold;">Sign In</a></p>
    </div>
</body>
</html>
