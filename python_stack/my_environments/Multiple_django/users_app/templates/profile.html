<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 30px;">
    <div style="max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center;">
        
        <div style="text-align: left; margin-bottom: 20px;">
            <a href="/dashboard" style="color: #007bff; text-decoration: none; font-weight: bold;">&larr; Back to Dashboard</a>
        </div>

        <div style="margin-bottom: 25px;">
            {% if profile_user.avatar %}
                <img src="{{ profile_user.avatar.url }}" alt="Avatar" style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #6f42c1; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
            {% else %}
                <div style="width: 150px; height: 150px; border-radius: 50%; background-color: #e9ecef; color: #6c757d; font-size: 48px; line-height: 150px; margin: 0 auto; border: 4px solid #ccc;">
                    👤
                </div>
            {% endif %}
        </div>

        <h1 style="color: #6f42c1; margin: 0 0 10px 0;">{{ profile_user.first_name }} {{ profile_user.last_name }}</h1>
        <p style="color: #6c757d; font-size: 16px; margin-bottom: 30px;">Gamer Profile</p>

        <div style="background-color: #f8f9fa; padding: 20px; border-radius: 6px; text-align: left; border: 1px solid #dee2e6;">
            <div style="margin-bottom: 12px; font-size: 16px;">
                <strong>Email Address:</strong> <span style="color: #495057;">{{ profile_user.email }}</span>
            </div>
            <div style="font-size: 16px;">
                <strong>Date of Birth:</strong> <span style="color: #495057;">{{ profile_user.birth_date|date:"F d, Y" }}</span>
            </div>
        </div>

    </div>
</body>
</html>
