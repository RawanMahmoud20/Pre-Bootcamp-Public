<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 30px;">
    <div style="max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        <div style="margin-bottom: 20px;">
            <a href="/dashboard" style="color: #007bff; text-decoration: none; font-weight: bold;">← Back to Dashboard</a>
        </div>
        <h2 style="color: #6f42c1; margin-top: 0; border-bottom: 2px solid #6f42c1; padding-bottom: 10px;">Edit User Info</h2>

        <form action="/users/edit/info/{{ target_user.id }}" method="POST" style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px;">
            {% csrf_token %}
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">First Name:</label>
                <input type="text" name="first_name" value="{{ target_user.first_name }}" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Last Name:</label>
                <input type="text" name="last_name" value="{{ target_user.last_name }}" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Email:</label>
                <input type="email" name="email" value="{{ target_user.email }}" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            {% if current_user.user_level == 'admin' %}
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">User Level:</label>
                <select name="user_level" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="normal" {% if target_user.user_level == 'normal' %}selected{% endif %}>Normal</option>
                    <option value="admin" {% if target_user.user_level == 'admin' %}selected{% endif %}>Admin</option>
                </select>
            </div>
            {% endif %}
            <button type="submit" style="background-color: #ffc107; color: #212529; font-weight: bold; padding: 10px; border: none; border-radius: 4px; cursor: pointer;">Update Info</button>
        </form>

        <h2 style="color: #6f42c1; border-bottom: 2px solid #6f42c1; padding-bottom: 10px;">Change Password</h2>
        <form action="/users/edit/password/{{ target_user.id }}" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
            {% csrf_token %}
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">New Password:</label>
                <input type="password" name="password" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Confirm Password:</label>
                <input type="password" name="password_confirm" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <button type="submit" style="background-color: #6f42c1; color: white; font-weight: bold; padding: 10px; border: none; border-radius: 4px; cursor: pointer;">Update Password</button>
        </form>
    </div>
</body>
</html>
