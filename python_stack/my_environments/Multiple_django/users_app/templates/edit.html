<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Game</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 30px;">
    <div style="max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        <h2 style="color: #6f42c1; margin-top: 0; border-bottom: 2px solid #6f42c1; padding-bottom: 10px;">Edit Game Info</h2>
        
        <form action="/games/{{ game.id }}/edit" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
            {% csrf_token %}
            
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Game Name:</label>
                <input type="text" name="title" value="{{ game.title }}" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Genre:</label>
                <select name="genre" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="Action" {% if game.genre == "Action" %}selected{% endif %}>Action</option>
                    <option value="Strategy" {% if game.genre == "Strategy" %}selected{% endif %}>Strategy</option>
                    <option value="RPG" {% if game.genre == "RPG" %}selected{% endif %}>RPG</option>
                </select>
            </div>
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Release Date:</label>
                <input type="date" name="release_date" value="{{ game.release_date|date:'Y-m-d' }}" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Description:</label>
                <textarea name="description" rows="4" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; resize: vertical;">{{ game.description }}</textarea>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button type="submit" style="background-color: #ffc107; color: #212529; font-weight: bold; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; flex: 1;">Update Game</button>
                <a href="/dashboard" style="background-color: #6c757d; color: white; text-align: center; text-decoration: none; font-weight: bold; padding: 10px 20px; border-radius: 4px; flex: 1;">Cancel</a>
            </div>
   
   
        </form>
    </div>
</body>
</html>
